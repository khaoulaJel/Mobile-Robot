controller_manager:
  ros__parameters:
    update_rate: 30
    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster
diff_cont:
  ros__parameters:
    publish_rate: 30.0
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: false
    left_wheel_names:
    - left_wheel_joint
    right_wheel_names:
    - right_wheel_joint
    wheel_separation: 0.177046
    wheel_radius: 0.034
    use_stamped_vel: false
    twist_covariance_diagonal:
    - 0.0025
    - 1.0
    - 1000000.0
    - 1000000.0
    - 1000000.0
    - 0.04
    pose_covariance_diagonal:
    - 1.0
    - 1.0
    - 1000000.0
    - 1000000.0
    - 1000000.0
    - 1.0
    velocity_rolling_window_size: 3
    cmd_vel_timeout: 0.5
joint_broad:
  ros__parameters:
    joints:
    - left_wheel_joint
    - right_wheel_joint
