# Reference controller for the PROFESSOR'S ROBOT, heading channel: the DEFENDED DESIGN = PD with a model-based observer.
#
# Why this structure (tools/p_family_study.py: P, PI, PD, PID and PID+rest/pulse layer, each tuned with the same optimiser and
# budget, judged on 300 validation cases none of them was tuned on; mean final heading error in degrees, +- standard error):
#
#                 normal conditions   STRESS (slow/late/freezing pose)   WRONG ROBOT (deadband 0.12-0.30, extra lag 0-0.4 s, +-gain)
#   P             4.56 +- 0.28        5.86 +- 0.42                        8.40 +- 0.54
#   PI            4.65 +- 0.26        5.62 +- 0.36                        5.95 +- 0.47
#   PD  (THIS)    0.26 +- 0.02        0.36 +- 0.04                        2.31 +- 0.31
#   PID           0.17 +- 0.02        0.27 +- 0.03                        3.14 +- 0.43
#   PID+layer     0.41 +- 0.04        0.59 +- 0.05                        2.23 +- 0.30
#
# P and PI cannot beat the robot's deadband (4-8 deg off). The derivative, fed by the observer's turn rate, is what makes the
# difference. PD ties PID+layer on a wrong robot and beats it everywhere else; PID is 0.09 deg better when the model is right
# but 0.8 deg worse when it is wrong, and the real robot's model is the unknown. Full study: results/real_robot/tuning_report.md.
#
# SIMULATION RESULT with the professor's robot model. The remaining error is dominated by one unknown, the robot's TRUE DEADBAND
# (if it is much larger than 0.2 rad/s the error grows to 5 deg): measure it (tools/measure_response.py) and put it in
# deadband_w below, then re-tune with tools/p_family_study.py.
#
#   ros2 launch lab3_controllers reference.launch.py config:=reference_lab_robot_tuned.yaml \
#        cmd_topic:=/diff_cont/cmd_vel_unstamped state_topic:=/robot_pose
#   ros2 topic pub --once /reference_yaw std_msgs/msg/Float64 "{data: 1.5708}"          # target pi/2
#
# Pose references (go to x, y) run in the classic mode and are NOT tuned here; they share a few compensation names (lead_w,
# vel_filter, pose_latency, ...) with the heading, so check a path with this file before relying on it, or use reference_lab_robot.yaml.
reference_controller:
  ros__parameters:
    state_topic: /robot_pose
    cmd_topic: /diff_cont/cmd_vel_unstamped
    reference_topic: /reference
    reference_yaw_topic: /reference_yaw
    use_degrees: false
    relative_to_start: false              # absolute headings in the map frame (the professor's frame)
    use_initial_yaw_reference: false
    use_state_stamps: true                # timed mode: the controller gets each sample's time stamp and age
    start_delay: 1.0
    max_linear_accel: 0.4
    max_angular_accel: 1.5

    # --- pose reference (go to x, y, then align the heading): classic mode, unchanged ---
    strategy: stop_turn
    kv: 0.8
    kw: 2.2
    k_yaw: 0.8
    turn_in_place_deg: 15.0
    max_linear_speed: 0.1
    pos_tolerance: 0.01
    yaw_tolerance: 0.01
    smooth_yaw_tolerance: 0.21
    lead_v: 0.3

    # --- heading: PD + observer (the tuned set) ---
    kp: 1.2802                            # 1/s   proportional gain
    ki: 0.0                               #       no integral term (PID was worse with a wrong robot)
    max_angular_speed: 0.5982             # rad/s
    tolerance: 0.0265                     # rad   dead zone on the PREDICTED error (1.5 deg); the observed final error is far smaller
    use_observer: true                    # model-based prediction of the present heading and turn rate
    obs_tau: 0.539                        # s     robot turn-rate lag in the model
    obs_gain: 0.915                       #       robot turn-rate gain in the model
    obs_k1: 0.8183                        #       how much of a new sample's heading difference corrects the model
    obs_k2: 0.9516                        # 1/s   ... and the model's turn rate
    pose_latency: 0.6196                  # s     delay of the pose (the sample describes the heading this long ago)
    lead_w: 0.7674                        # s     the derivative action: predicted rest heading = heading + turn rate * lead_w
    vel_span: 1.3685                      # s     measured-speed estimate = slope over this window
    vel_filter: 0.6702
    rest_window: 0.0                      # no rest-verify / pulse layer (it made the result worse)
    adapt_deadband: false                 # tested: mixed results (see the report), so off

    # --- the robot's command filter (professor's model) ---
    diamond_v: 0.3
    diamond_w: 2.5
    deadband_v: 0.04
    deadband_w: 0.2
